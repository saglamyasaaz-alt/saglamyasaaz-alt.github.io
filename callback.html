<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortsBot – TikTok</title>
<style>
  :root { --bg:#f6f8f6; --fg:#17201b; --accent:#1f7a4d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111713; --fg:#e4ebe6; --accent:#5cc48f; color-scheme: dark } }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding-inline:16px; padding-block:48px; }
  main { max-width:640px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-family:Georgia,serif; margin:0; }
</style>
</head>
<body>
<main>
  <h1 id="h">TikTok connected</h1>
  <p id="m">You can close this page and return to ShortsBot. / Bu səhifəni bağlayıb ShortsBot-a qayıda bilərsiniz.</p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get("error")) { document.getElementById("h").textContent = "TikTok: " + q.get("error"); document.getElementById("m").textContent = q.get("error_description") || ""; }
</script>
</body>
</html>
