<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortsBot – TikTok</title>
<style>
  :root { --bg:#f6f8f6; --fg:#17201b; --muted:#55625a; --accent:#1f7a4d; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111713; --fg:#e4ebe6; --muted:#9aa89f; --accent:#5cc48f; --bad:#ff8a80; color-scheme: dark } }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding-inline:16px; padding-block:48px; }
  main { max-width:640px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-family:Georgia,serif; margin:0; text-wrap:balance; }
  p { margin:0; } .muted { color:var(--muted); } .bad { color:var(--bad); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="h">TikTok qoşulur… <span class="muted" style="font-size:.6em">/ Connecting TikTok…</span></h1>
  <p id="m" class="muted">Bir neçə saniyə gözləyin, səhifəni bağlamayın.</p>
  <p><a href="approve.html">← Təsdiq səhifəsinə qayıt / Back to approval page</a></p>
</main>
<script>
const API = "https://api.github.com/repos/saglamyasaaz-alt/shortsbot";
const REDIRECT = "https://saglamyasaaz-alt.github.io/callback.html";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
let token = "", expected = "";
try { token = localStorage.getItem("sb_token") || ""; expected = localStorage.getItem("sb_tt_state") || ""; } catch (e) {}

function fail(msg) { $("h").textContent = "TikTok qoşulmadı / Not connected"; $("m").className = "bad"; $("m").textContent = msg; }
async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { Authorization: `Bearer ${token}`, Accept: opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json" } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub xətası ${r.status}`);
  return r.status === 204 ? true : (opts.raw ? r.text() : r.json());
}

(async () => {
  if (q.get("error")) return fail(`${q.get("error")}: ${q.get("error_description") || ""}`);
  const code = q.get("code");
  if (!code) return fail("TikTok kod göndərmədi.");
  if (!expected || q.get("state") !== expected) return fail("Təhlükəsizlik yoxlaması alınmadı (state uyğun deyil). Təsdiq səhifəsindən yenidən cəhd edin.");
  if (!token) return fail("GitHub açarı tapılmadı. Əvvəlcə təsdiq səhifəsində qoşulun.");
  history.replaceState(null, "", location.pathname);  // kodu ünvan sətrindən sil
  try {
    const started = Date.now();
    const cur = await gh(`/contents/data/tiktok_auth_code.json?ref=main`);
    const body = { message: "TikTok qoşulma kodu", branch: "main",
      content: btoa(JSON.stringify({ code, redirect_uri: REDIRECT, at: new Date(started).toISOString() })) };
    if (cur && cur.sha) body.sha = cur.sha;
    await gh(`/contents/data/tiktok_auth_code.json`, { method: "PUT", body: JSON.stringify(body) });
    await gh(`/actions/workflows/tiktok_auth.yml/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main" }) });
    try { localStorage.removeItem("sb_tt_state"); } catch (e) {}
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 6000));
      const t = await gh(`/contents/data/tiktok_auth_status.json?ref=main&t=${Date.now()}`, { raw: true });
      if (!t) continue;
      const st = JSON.parse(t);
      // status vaxtı Bakı vaxtı ilə yazılır (UTC+4)
      if (st.at && new Date(st.at + "+04:00").getTime() >= started - 60000) {
        if (st.ok) {
          $("h").textContent = "TikTok qoşuldu ✓ / Connected";
          $("m").className = ""; $("m").textContent = `Hesab: ${st.nickname || ""} · İcazələr: ${st.scope || ""}`;
        } else fail(st.error || "Naməlum xəta");
        return;
      }
    }
    fail("Cavab gecikdi. Bir az sonra təsdiq səhifəsində 'Yenilə' basın.");
  } catch (e) { fail(e.message); }
})();
</script>
</body>
</html>
